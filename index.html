<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>currency-converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div class="header">
        <div class="head">
          <div class="img">
            <img
              src="coins-paper-money-globe-white-statistic-form-background_1387-296.avif"
              alt="aaaaaaaaaaa" />
          </div>
          <p>currency-converter</p>
        </div>
      </div>
      <div class="main">
        <div class="main_content">
          <h1 class="amount">Amount</h1>
          <div class="switcher">
            <input
              class="amount_value"
              type="text"
              placeholder="1 by default"
              style="display: block" />
            <button class="turn_event">switch</button>
          </div>
          <div class="currencies">
            <div class="base">
              <img
                src="https://flagsapi.com/AE/shiny/32.png"
                alt=""
                class="base_img" />
              <select name="" id="base_country">
                <option value="">ssssssss</option>
              </select>
            </div>
            <div class="tunrned">
              <img
                src="https://flagsapi.com/AE/shiny/32.png"
                alt=""
                class="turned_img" /><select name="" id="turned_country">
                <option value="">ssssssssss</option>
              </select>
            </div>
            <button class="convert">convert</button>
          </div>
          <div class="result"></div>
        </div>
      </div>
    </section>

    <script src="main.js"></script>
  </body>
</html>
